<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - Tải video từ YouTube, Facebook, TikTok</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Video Downloader</h1>
            <p class="subtitle">Tải video từ YouTube, Facebook, TikTok</p>
        </header>

        <main>
            <div class="download-form">
                <div class="form-group">
                    <label for="url-input">Nhập URL video:</label>
                    <textarea 
                        id="url-input" 
                        placeholder="https://youtube.com/watch?v=...&#10;https://facebook.com/watch?v=...&#10;https://tiktok.com/@user/video/..."
                        rows="3"
                    ></textarea>
                    <small class="hint">Có thể nhập nhiều URL, mỗi URL một dòng</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="format-select">Định dạng:</label>
                        <select id="format-select">
                            <option value="mp4">MP4 (Video)</option>
                            <option value="mp3">MP3 (Audio)</option>
                            <option value="webm">WEBM</option>
                            <option value="m4a">M4A (Audio)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quality-select">Chất lượng:</label>
                        <select id="quality-select">
                            <option value="best">Tốt nhất</option>
                            <option value="1080p">1080p</option>
                            <option value="720p">720p</option>
                            <option value="480p">480p</option>
                            <option value="360p">360p</option>
                        </select>
                    </div>
                </div>

                <button id="download-btn" class="btn-primary">
                    <span class="btn-text">Bắt đầu tải</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </div>

            <div id="tasks-container" class="tasks-container">
                <h2>Danh sách tải</h2>
                <div id="tasks-list"></div>
                <div id="empty-state" class="empty-state">
                    <p>Chưa có video nào được thêm vào danh sách tải</p>
                </div>
            </div>
        </main>

        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
